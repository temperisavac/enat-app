    <!-- Resilient WebSocket & HMR Handler for cloud proxy preview environment -->
    <script>
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            // Intercept Vite dev server HMR websocket connections
            if (urlStr.indexOf('@vite') !== -1 || urlStr.indexOf('vite') !== -1 || urlStr.indexOf('3000') !== -1 || (urlStr.indexOf('ais-') !== -1 && urlStr.indexOf('firestore') === -1)) {
              var listeners = {};
              var fakeWs = {
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: urlStr,
                protocol: '',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { listener({ type: 'open', target: fakeWs }); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                if (typeof fakeWs.onopen === 'function') {
                  try { fakeWs.onopen({ type: 'open', target: fakeWs }); } catch (e) {}
                }
              }, 0);
              return fakeWs;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var isWsError = function(val) {
          if (!val) return false;
          var str = String(val.message || val.reason || val.stack || val || '');
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('closed without opened') !== -1 ||
                 str.indexOf('@vite/client') !== -1;
        };

        window.onerror = function(message, source, lineno, colno, error) {
          if (isWsError(message) || isWsError(error)) {
            return true;
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || isWsError(event.error)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsError(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
